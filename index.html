<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Semáforo de Ruido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white">Monitoreo Acústico Inteligente</h1>
            <span class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">Sistema Online</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
                <span class="text-xs font-semibold uppercase text-slate-400">Nivel Actual de Ruido</span>
                <div class="mt-3 flex items-baseline gap-2">
                    <span class="text-4xl font-extrabold text-white" id="currentVal">--</span>
                    <span class="text-sm text-slate-400">unidades</span>
                </div>
                <div class="mt-4 pt-3 border-t border-slate-700/60 flex justify-between">
                    <span class="text-xs text-slate-400">Estado:</span>
                    <span id="badgeState" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300">Iniciando...</span>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl md:col-span-2 flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold uppercase text-slate-400">Control Manual del Actuador Físico</span>
                    <p id="recommendationText" class="mt-2 text-sm text-slate-200">Envía comandos directos al Field 2 para forzar o liberar el sistema.</p>
                </div>
                <div class="flex gap-3 mt-4">
                    <button onclick="enviarComando(1)" class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-triangle-exclamation"></i> Forzar Alerta (Rojo)
                    </button>
                    <button onclick="enviarComando(0)" class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center justify-center gap-2 border border-slate-600">
                        <i class="fa-solid fa-rotate-left"></i> Automático (Semáforo)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CHANNEL_ID = '3525715'; 

        async function fetchData() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=1`);
                const data = await response.json();
                if (data && data.feeds.length > 0) {
                    const val = parseInt(data.feeds[0].field1 || 0);
                    document.getElementById('currentVal').innerText = val;
                }
            } catch (error) {
                console.error("Error al obtener datos", error);
            }
        }

        function enviarComando(tipo) {
            const writeAPIKey = "EBB94WPYJTBH4II6"; 
            
            // Generamos un número único en cada clic para que ThingSpeak SIEMPRE lo registre como un dato nuevo:
            // Si tipo es 1 (Forzar), manda un número entre 1000 y 1999.
            // Si tipo es 0 (Automático), manda un número entre 1 y 99.
            const valorUnico = (tipo === 1) ? (1000 + Math.floor(Math.random() * 900)) : (1 + Math.floor(Math.random() * 90));
            
            const url = `https://api.thingspeak.com/update?api_key=${writeAPIKey}&field2=${valorUnico}`;
            
            fetch(url)
              .then(response => {
                if(response.ok) {
                    const badge = document.getElementById('badgeState');
                    const rec = document.getElementById('recommendationText');
                    if (tipo === 1) {
                        badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                        badge.innerText = "ALERTA FORZADA";
                        rec.innerText = "⚠️ Alerta enviada. El LED Rojo se encenderá en breve.";
                    } else {
                        badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                        badge.innerText = "SILENCIO / AUTO";
                        rec.innerText = "Modo automático restablecido. Regulando según sensor.";
                    }
                }
              })
              .catch(error => console.error('Error de red:', error));
        }

        setInterval(fetchData, 15000);
        fetchData();
    </script>
</body>
</html>
